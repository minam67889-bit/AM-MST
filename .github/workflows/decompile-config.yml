name: Decompile the server-selection code

# The one thing still unknown is what the app puts in argv: `f.b()` feeds
# `-udp <host>:53`, and `"sd-" + f.l()` is the dnstt zone. Everything else about
# the native run is already reproduced (linker, licence string, pubkey).
#
# Reading that from raw smali is painful, so this job decompiles the APK with
# jadx in CI and publishes just the classes that matter.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decompile-config.yml"

permissions:
  contents: write
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p art
          run=$(gh run list --workflow=analyze-apk.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          art=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                  --jq '.artifacts[] | select(.name=="amtunnel-apk-analysis") | .id' | head -1)
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > art/a.zip
          unzip -o -q art/a.zip -d art/x
          cp "$(find art/x -name '*.apk' | head -1)" art/bdnet.apk
          ls -l art/bdnet.apk
          echo "== what the analysis artifact already carries"
          find art/x -maxdepth 3 -type d | head -20
          find art/x -name 'C0223If.java' -o -name 'C0223If.smali' | head

      - name: Who writes BackQuery and SSH_HOST?
        run: |
          exec > >(tee /tmp/writers.txt) 2>&1
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          timeout 1500 apktool d -f --no-res -o smali art/bdnet.apk 2>&1 | tail -3
          ls smali* 2>/dev/null | head
          for pair in "BackQuery:0xffff713d27d28875" "SSH_HOST:0xffff700527d28875" \
                      "PROXY_HOST:0xffff6f8b27d28875"; do
            name=${pair%%:*}; hex=${pair##*:}
            dec=$((16#${hex#0x}))
            signed=$(python3 -c "print($dec - (1<<64) if $dec >= (1<<63) else $dec)")
            echo "========== $name  ($signed)"
            grep -rn -- "-0x$(printf '%x' $(( (1<<64) - (hex & 0 )) ))L" /dev/null 2>/dev/null
            echo "--- smali hits (decimal constant)"
            grep -rln "const-wide v[0-9]*, $signed" smali* 2>/dev/null | head -5
            grep -rln -- "-$((0))" /dev/null 2>/dev/null
            grep -rln "${signed}L" smali* 2>/dev/null | head -5
            grep -rn "$hex" smali* 2>/dev/null | head -5
          done
          echo "========== ZT.q (the setter helper)"
          find smali* -name 'ZT.smali' | head -2
          f=$(find smali* -name 'ZT.smali' | head -1)
          [ -n "$f" ] && sed -n '1,80p' "$f"


          set -euo pipefail
          curl -sSL -o jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version

      - name: Decompile just what we need
        run: |
          set +e
          mkdir -p out
          # --no-res keeps this fast; the app's logic lives in defpackage + prince
          timeout 3000 jadx/bin/jadx -d out --no-res --threads-count 4 art/bdnet.apk \
            --single-class defpackage.C0223If 2>&1 | tail -5
          find out -name '*.java' | head -20
          ls -la out/sources/defpackage 2>/dev/null | head

      - name: Publish the interesting methods
        run: |
          exec > >(tee /tmp/decompile.txt) 2>&1
          set +e
          mkdir -p analysis-bdnet/configs
          f=$(find out -name 'C0223If.java' | head -1)
          echo "== C0223If: $f"
          if [ -n "$f" ]; then
            cp "$f" analysis-bdnet/configs/C0223If.java
            echo "--- b() l() j() m() n() o() r() t()"
            grep -n -A 12 "public .* b()\|public .* l()\|public .* j()\|public .* m()\|public .* n()\|public .* o()\|public .* r()\|public .* t()" "$f" | head -160
          fi
          echo
          echo "== every string the XRay service feeds to argv"
          grep -n "arrayList.add\|new ProcessBuilder" analysis-bdnet/app-sources/sources_prince/dastan/vpn/service/XRayDNSService.java | head -20

      - name: Publish
        if: always()
        continue-on-error: true
        run: |
          mkdir -p analysis-bdnet/configs
          cp /tmp/decompile.txt analysis-bdnet/configs/decompile.txt 2>/dev/null || true
          cp /tmp/writers.txt analysis-bdnet/configs/writers.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-bdnet/configs
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "dns: decompiled server-selection class [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
