name: Decompile the server-selection code

# Two things were still unknown: which preference feeds `-udp <host>:53`
# (`f.b()` = BackQuery) and which one becomes the dnstt zone, `"sd-" + f.l()`
# (= SSH_HOST). This job answers both from the APK itself:
#
#   1. baksmali the APK and grep for the exact long ids, so we see every
#      call site that writes those two preferences and, more importantly, the
#      value handed to them when a DNS server is picked;
#   2. jadx just the classes that turn out interesting.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decompile-config.yml"

permissions:
  contents: write
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p art
          run=$(gh run list --workflow=analyze-apk.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          art=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                  --jq '.artifacts[] | select(.name=="amtunnel-apk-analysis") | .id' | head -1)
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > art/a.zip
          unzip -o -q art/a.zip -d art/x
          cp "$(find art/x -name '*.apk' | head -1)" art/bdnet.apk
          ls -l art/bdnet.apk

      - name: Tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          curl -sSL -o /tmp/jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --version

      - name: baksmali and find the call sites
        run: |
          exec > >(tee /tmp/writers.txt) 2>&1
          set +e
          timeout 1500 apktool d -f --no-res -o smali art/bdnet.apk 2>&1 | tail -3
          ls -d smali* 2>/dev/null
          # a negative long id shows up in smali as -0x<magnitude>L
          for pair in "BackQuery:8ec2d82d778b" "SSH_HOST:8ffad82d778b" \
                      "PROXY_HOST:9074d82d778b" "isFastDns:8eacd82d778b" \
                      "isSlowDns:8ea2d82d778b"; do
            name=${pair%%:*}; mag=${pair##*:}
            echo "========== $name  (-0x${mag}L)"
            hits=$(grep -rl -e "-0x${mag}L" smali* 2>/dev/null | head -12)
            echo "$hits"
            for h in $hits; do
              echo "--- $h"
              grep -n -B8 -A14 -e "-0x${mag}L" "$h" | head -60
            done
          done
          echo "========== the preference helper ZT.q"
          f=$(find smali* -name 'ZT.smali' | head -1)
          echo "$f"
          [ -n "$f" ] && sed -n '1,60p' "$f"
          echo "========== classes touching the server list"
          grep -rl "SERVER_SELECTED_POSITION\|Free_servers" smali*/defpackage 2>/dev/null | head -10

      - name: jadx the interesting classes
        run: |
          exec > >(tee /tmp/decompile.txt) 2>&1
          set +e
          classes=$(grep -oE "smali[^/]*/defpackage/([A-Za-z0-9_]+)\.smali" /tmp/writers.txt \
                    | sed 's#.*/##; s/\.smali$//' | sort -u | head -12)
          echo "candidates: $classes"
          mkdir -p out
          for cls in $classes C0223If; do
            timeout 600 /tmp/jadx/bin/jadx -d "out/$cls" --no-res art/bdnet.apk \
              --single-class "defpackage.$cls" 2>&1 | tail -2
          done
          find out -name '*.java' | head -20
          for f in $(find out -name '*.java'); do
            echo "===== $f"
            grep -n -A14 "public final void .*(String str)\|public final String [a-z]()" "$f" | head -50
          done

      - name: Publish
        if: always()
        continue-on-error: true
        run: |
          mkdir -p analysis-bdnet/configs
          for f in writers decompile; do
            cp "/tmp/$f.txt" "analysis-bdnet/configs/$f.txt" 2>/dev/null || true
          done
          for f in $(find out -name '*.java' 2>/dev/null | head -15); do
            cp "$f" "analysis-bdnet/configs/$(basename "$f")" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-bdnet/configs
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "dns: decompiled server-selection code [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
