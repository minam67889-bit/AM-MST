name: AM Tunnel APK analysis

# The agent sandbox cannot reach filebin.net or GitHub release assets, but a
# GitHub runner can. This workflow downloads the original AM Tunnel APK,
# decompiles it and commits a compact text report back to the branch so the
# findings can be read (and acted on) from the sandbox.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL of the APK / zip to analyse"
        required: false
        default: "https://filebin.net/6kebb3eierc437j7/app.vpn.amtunnellite.zip"
      out_dir:
        description: "Directory the committed report goes to"
        required: false
        default: "analysis"
  push:
    paths:
      - "tools/apk_analysis.py"
      - "apk-target.env"
      - ".github/workflows/analyze-apk.yml"

permissions:
  contents: write
  checks: write

concurrency:
  group: analyze-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Download and decompile AM Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve analysis target
        run: |
          set -euo pipefail
          # Dispatch inputs win; otherwise the committed target file decides, so a
          # plain push can point the analysis at a new APK.
          if [ -n "${{ github.event.inputs.apk_url || '' }}" ]; then
            APK_URL="${{ github.event.inputs.apk_url }}"
            OUT_DIR="${{ github.event.inputs.out_dir || 'analysis' }}"
          elif [ -f apk-target.env ]; then
            # shellcheck disable=SC1091
            . ./apk-target.env
          else
            APK_URL="https://filebin.net/6kebb3eierc437j7/app.vpn.amtunnellite.zip"
            OUT_DIR="analysis"
          fi
          echo "target: $APK_URL"
          echo "report dir: $OUT_DIR"
          {
            echo "APK_URL=$APK_URL"
            echo "OUT_DIR=$OUT_DIR"
          } >> "$GITHUB_ENV"
          # never let one APK's report contaminate another's
          rm -rf analysis

      - name: Download the APK
        continue-on-error: true
        run: |
          exec > >(tee -a download.log) 2>&1
          set -x
          mkdir -p apk
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          JAR=/tmp/cookies.txt
          : > "$JAR"
          trY() {
            url="$1"; out="$2"
            echo "== trying $url"
            # A cookie jar matters: filebin sets `verified` on the first hit and
            # serves the actual file only to a client that presents it back.
            curl -sSL --connect-timeout 20 --max-time 900 -A "$UA" \
                 -c "$JAR" -b "$JAR" \
                 -H "Accept: application/octet-stream, application/vnd.android.package-archive, text/html, */*" \
                 -e "https://filebin.net/" \
                 -D "$out.headers" -o "$out" "$url"
            echo "curl exit: $?"
            head -20 "$out.headers" 2>/dev/null
            file "$out" 2>/dev/null
            ls -l "$out" 2>/dev/null
          }
          trY "$APK_URL" apk/candidate
          if file apk/candidate | grep -qi "zip archive"; then :; else
            echo "== second attempt with the cookie filebin just set"
            sleep 5
            trY "$APK_URL" apk/candidate
            if ! file apk/candidate | grep -qi "zip archive"; then
              echo "== following links/forms found in the interstitial"
              grep -oiE '<title>[^<]*</title>' apk/candidate | head -3
              sed -n '1,400p' apk/candidate | grep -oiE '(action|href)="[^"]+"' | head -20
              for link in $(grep -oiE 'href="[^"]+"' apk/candidate | cut -d'"' -f2 | head -10); do
                case "$link" in
                  http*) target="$link" ;;
                  *) target="https://filebin.net$link" ;;
                esac
                echo "-> $target"
                trY "$target" apk/candidate2
                if file apk/candidate2 | grep -qi "zip archive"; then
                  mv apk/candidate2 apk/candidate; break
                fi
              done
              # last resort: POST the confirm form
              action=$(grep -oiE '<form[^>]*action="[^"]+"' apk/candidate | head -1 | cut -d'"' -f2)
              if [ -n "${action:-}" ] && ! file apk/candidate | grep -qi "zip archive"; then
                echo "-> POST https://filebin.net$action"
                curl -sSL -A "$UA" -c "$JAR" -b "$JAR" -X POST \
                     -D apk/post.headers -o apk/candidate -e "$APK_URL" \
                     "https://filebin.net$action" || true
                file apk/candidate
              fi
            fi
          fi
          if ! file apk/candidate | grep -qi "zip archive"; then
            echo "== first attempt did not yield a zip; dumping beginning of body"
            head -c 6000 apk/candidate 2>/dev/null
            echo
            grep -oE 'href="[^"]+"' apk/candidate 2>/dev/null | head -20
            grep -oE 'https?://[^"<> ]+\.(zip|apk)[^"<> ]*' apk/candidate 2>/dev/null | head -10
          fi
          if ! file apk/candidate | grep -qi "zip archive"; then
            if ! echo "$APK_URL" | grep -qi amtunnellite; then
              echo "no mirror fallbacks configured for this URL"
              for url in; do :; done
            else
            for url in \
              "https://d.apkpure.com/b/APK/app.vpn.amtunnellite?version=latest" \
              "https://d.apkpure.net/b/APK/app.vpn.amtunnellite?version=latest" \
              "https://apkpure.net/am-tunnel-lite-vpn/app.vpn.amtunnellite/download" \
              "https://apkcombo.app/am-tunnel-lite-vpn/app.vpn.amtunnellite/download/apk" \
              "https://apk.support/download/app.vpn.amtunnellite/latest" \
              "https://apkpure.com/am-tunnel-lite-vpn/app.vpn.amtunnellite/download"
            do
              trY "$url" apk/candidate2
              if file apk/candidate2 | grep -qi "zip archive"; then mv apk/candidate2 apk/candidate; break; fi
            done
            fi
          fi
          if ! file apk/candidate | grep -qi "zip archive"; then
            echo "== not a plain zip; trying to carve one out of the body"
            python3 - <<'PY' || true
          import sys
          data = open("apk/candidate", "rb").read()
          start = data.find(b"PK\x03\x04")
          end_marker = data.rfind(b"PK\x05\x06")
          if start >= 0 and end_marker > start:
              end = end_marker + 22
              carved = data[start:end]
              open("apk/carved.zip", "wb").write(carved)
              print(f"carved {len(carved)} bytes from offset {start} (body was {len(data)})")
          else:
              print("no zip signature found in the body")
          PY
            if [ -f apk/carved.zip ]; then
              mv apk/carved.zip apk/candidate
              file apk/candidate
            fi
          fi
          if file apk/candidate | grep -qi "zip archive"; then
            echo "DOWNLOAD_OK $(stat -c%s apk/candidate) bytes"
            cp apk/candidate download.bin
          else
            echo "DOWNLOAD_FAILED"
          fi

      - name: Unpack
        run: |
          exec > >(tee -a unpack.log) 2>&1
          set -euxo pipefail
          test -f download.bin || { echo "error: download.bin missing"; exit 1; }
          ls -l download.bin
          rm -rf unpacked
          mkdir -p unpacked
          # The download may be an APK itself (APK == zip) or a zip containing APKs.
          if unzip -Z1 download.bin | grep -qE '^(AndroidManifest\.xml|classes[0-9]*\.dex)$'; then
            echo "download is the APK itself"
            mkdir -p apks && cp download.bin apks/base.apk
          else
            unzip -o -q download.bin -d unpacked
            find unpacked -maxdepth 3 -type f -printf '%10s  %p\n' | sort -rn | head -30
            mkdir -p apks
            i=0
            while read -r line; do
              i=$((i+1)); cp "$line" "apks/split-$i.apk"
            done < <(find unpacked -name "*.apk" | sort)
          fi
          # The base APK is the one carrying dex + the manifest; splits only carry resources/libs.
          rm -f apks/base.apk.tmp
          for candidate in apks/*.apk; do
            if unzip -Z1 "$candidate" | grep -qE '^classes[0-9]*\.dex$'; then
              echo "base APK: $candidate"
              cp "$candidate" apks/base.apk.tmp
            fi
          done
          test -f apks/base.apk.tmp || {
            echo "error: no APK with dex found; candidates:"; ls -l apks
            exit 1
          }
          mv apks/base.apk.tmp amtunnel.apk
          if [ ! -f apks/base.apk ] || ! cmp -s apks/base.apk amtunnel.apk; then
            cp amtunnel.apk apks/base.apk
          fi
          echo "--- all APKs in the bundle ---"
          for f in apks/*.apk; do
            printf '%10s  dex=%s  so=%s  %s\n' "$(stat -c%s "$f")" \
              "$(unzip -Z1 "$f" | grep -cE '^classes[0-9]*\.dex$')" \
              "$(unzip -Z1 "$f" | grep -c '\.so$')" "$f"
          done
          ls apks/*.apk | grep -v '^apks/base.apk$' > split-apks.txt || true
          wc -l < split-apks.txt
          ls -l amtunnel.apk
          sha256sum amtunnel.apk
          unzip -l amtunnel.apk | head -15
          echo "dex files: $(unzip -Z1 amtunnel.apk | grep -cE '^classes[0-9]*\.dex$')"
          echo "native libs: $(unzip -Z1 amtunnel.apk | grep -c '\.so$')"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install analysis tools
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq apktool jadx unzip zip zstd > /dev/null 2>&1 || true
          if ! command -v apktool >/dev/null; then
            echo "installing apktool from upstream releases"
            curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar || true
            if [ -s /tmp/apktool.jar ]; then
              printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
              sudo chmod +x /usr/local/bin/apktool
            fi
          fi
          if ! command -v jadx >/dev/null; then
            echo "installing jadx from upstream releases"
            for version in 1.5.1 1.5.0 1.4.7; do
              if curl -fsSL -o /tmp/jadx.zip "https://github.com/skylot/jadx/releases/download/v${version}/jadx-${version}.zip"; then
                unzip -q -o /tmp/jadx.zip -d /opt/jadx && break
              fi
            done
            sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx 2>/dev/null || true
          fi
          command -v apktool && apktool --version || echo "apktool unavailable"
          command -v jadx && jadx --version || echo "jadx unavailable"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true

      - name: Decode manifest and resources
        run: |
          set -uo pipefail
          mkdir -p analysis
          AAPT2=$(ls /usr/local/lib/android/sdk/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging amtunnel.apk > analysis/badging.txt 2>&1 || true
            "$AAPT2" dump permissions amtunnel.apk > analysis/permissions.txt 2>&1 || true
            cat analysis/badging.txt | head -30
          fi
          apktool d -f -o decoded amtunnel.apk > analysis/apktool.log 2>&1 || true
          cp decoded/AndroidManifest.xml analysis/AndroidManifest.xml 2>/dev/null || true
          ls decoded 2>/dev/null | head -20 || true
          if [ -d decoded/res/values ]; then
            cp decoded/res/values/strings.xml analysis/res-strings.xml 2>/dev/null || true
          fi

      - name: Decompile with jadx
        continue-on-error: true
        run: |
          set -uo pipefail
          if command -v jadx >/dev/null; then
            timeout 1800 jadx -d java --no-res --threads-count 4 --show-bad-code amtunnel.apk > analysis/jadx.log 2>&1 || true
            find java -name "*.java" | wc -l || true
          else
            echo "jadx not available" | tee analysis/jadx.log
          fi

      - name: Extract smali of the application package
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p analysis/smali
          for dir in decoded/smali decoded/smali_classes*; do
            [ -d "$dir" ] || continue
            for pkg in app/vpn amtunnel vpn/amtunnel com/amtunnel; do
              if [ -d "$dir/$pkg" ]; then
                dest="analysis/smali/$(basename "$dir")/$(dirname "$pkg")"
                mkdir -p "$dest"
                cp -r "$dir/$pkg" "$dest/" 2>/dev/null || true
              fi
            done
          done
          du -sh analysis/smali 2>/dev/null || true

      - name: Collect keyword-matched sources
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p analysis/sources
          if [ -d java ]; then
            grep -rilE "dns|tunnel|vpn|resolver|base36|socks|handshake|encrypt" java \
              | head -400 > /tmp/matches.txt || true
            wc -l /tmp/matches.txt
            while read -r file; do
              dest="analysis/sources/$(dirname "${file#java/}")"
              mkdir -p "$dest"
              cp "$file" "$dest/" 2>/dev/null || true
            done < /tmp/matches.txt
            du -sh analysis/sources || true
          fi

      - name: Collect the application's own sources
        continue-on-error: true
        run: |
          exec > >(tee -a analysis/app-sources.log) 2>&1
          set -uxo pipefail
          mkdir -p analysis/app-sources
          # 1. the app's own package trees (names differ per vendor build)
          for pattern in java/prince java/dastan java/app/vpn java/com/prince java/*/prince java/*/dastan; do
            [ -d "$pattern" ] || continue
            dest="analysis/app-sources/$(echo "$pattern" | sed 's|^java/||; s|/|_|g')"
            mkdir -p "$dest"
            cp -r "$pattern"/. "$dest/" 2>/dev/null || true
            echo "copied $pattern"
          done
          # 2. anything that mentions a DNS tunnel, wherever it lives
          if [ -d java ]; then
            grep -rilE "slowdns|slow_dns|xdnstt|dnstt|tunnelDomain|tunnel_domain|dnsTunnel|dns_tunnel" java \
              --include=*.java 2>/dev/null | head -60 > /tmp/tunnel-matches.txt || true
            echo "tunnel-related java files: $(wc -l < /tmp/tunnel-matches.txt)"
            while read -r file; do
              [ -n "$file" ] || continue
              dest="analysis/app-sources/matches/$(dirname "${file#java/}")"
              mkdir -p "$dest"
              cp "$file" "$dest/" 2>/dev/null || true
            done < /tmp/tunnel-matches.txt
            # 3. config-ish assets shipped as text
            find decoded/assets -maxdepth 2 -type f \( -name "*.json" -o -name "*.ini" -o -name "*.conf" -o -name "*.txt" \) \
              -size -600k -exec cp --parents {} analysis/app-sources/ \; 2>/dev/null || true
          fi
          du -sh analysis/app-sources || true
          find analysis/app-sources -name "*.java" | head -20 || true
          echo "--- strings that look like a tunnel config ---"
          grep -rhoE "(slowdns|dnstt)[^ \"']{0,60}" analysis/app-sources 2>/dev/null | sort -u | head -20 || true

      - name: Decrypt LSParanoid strings
        continue-on-error: true
        run: |
          exec > >(tee -a analysis/deobfuscate.log) 2>&1
          set -uo pipefail
          mkdir -p analysis/obfuscation

          # BD NET is packed with LSParanoid: one generated class holds the
          # ciphertext table, DeobfuscatorHelper turns an id into a string.
          # jadx mangles that helper (0xffff0000 becomes -65536 and the index
          # sign-extends out of range), so we never compile it. Instead we run
          # tools/lsparanoid_decode.py, a literal port of LSParanoid's own
          # algorithm that proves itself with a round trip through the
          # obfuscator's encoder before touching the app's data.
          CHUNKS_JAVA=$(find java -name 'Deobfuscator$*.java' -path '*lsparanoid*' | head -1)
          echo "chunks class: ${CHUNKS_JAVA:-<none>}"

          # Call sites that jadx inlined only survive as smali: take the
          # const-wide that feeds each getString(J).
          : > /tmp/ids.smali.txt
          if [ -d decoded ]; then
            find decoded -name '*.smali' -print0 2>/dev/null \
              | xargs -0 awk '/const-wide .*0x[0-9a-fA-F]+L/ {lit=$NF} /->getString\(J\)/ {if (lit!="") print lit; lit=""}' \
              > /tmp/ids.hex 2>/dev/null || true
            if [ -s /tmp/ids.hex ]; then
              sed -E 's/L$//' /tmp/ids.hex | while read -r k; do
                case "$k" in
                  -0x*|0x*) printf '%d\n' "$k" 2>/dev/null || true ;;
                  *) printf '%s\n' "$k" ;;
                esac
              done >> /tmp/ids.smali.txt
            fi
            echo "smali ids: $(wc -l < /tmp/ids.smali.txt)"
          fi

          python3 tools/lsparanoid_decode.py --selftest
          if [ -n "${CHUNKS_JAVA:-}" ]; then
            python3 tools/lsparanoid_decode.py \
              --java "$CHUNKS_JAVA" \
              --scan java \
              --ids-file /tmp/ids.smali.txt \
              --out analysis/obfuscation/decrypted.txt \
              --hosts-out analysis/obfuscation/decrypted-hosts.txt
            echo "--- sample ---"
            head -30 analysis/obfuscation/decrypted.txt
            echo "--- endpoints ---"
            grep -aoE 'https?://[^[:space:]]+' analysis/obfuscation/decrypted.txt | sort -u | head -20
            echo "--- hosts ---"
            head -40 analysis/obfuscation/decrypted-hosts.txt
          else
            echo "no LSParanoid chunks class in this build"
          fi

      - name: Hunt bundled server lists and config code
        continue-on-error: true
        run: |
          exec > >(tee -a "analysis/config-hunt.log") 2>&1
          set -uxo pipefail
          mkdir -p "analysis/assets" "analysis/hunt"

          # 1. Bundled assets that could carry a server list.
          unzip -l amtunnel.apk | awk '{print $4}' \
            | grep -iE '^(assets|res/raw)/.*\.(psi|json|url|txt|conf|cfg|dat|db|bin)$' \
            | grep -viE 'audience_network|SignatureKiller|flags/' > /tmp/assetlist.txt || true
          while read -r a; do
            [ -n "$a" ] || continue
            out="analysis/assets/$(echo "$a" | tr '/' '_')"
            unzip -p amtunnel.apk "$a" > "$out" 2>/dev/null || true
            echo "== $a -> $(basename "$out") $(wc -c < "$out") bytes"
            head -c 240 "$out" | tr -cd '[:print:]\n' | head -4
            strings -n 6 "$out" 2>/dev/null | head -40 > "$out.strings.txt" || true
            strings -n 6 "$out" 2>/dev/null \
              | grep -oiE '[a-z0-9][a-z0-9.-]+\.(com|net|org|io|ir|app|dev|xyz|online|site|top|fun|club|shop|live|icu|me|co)' \
              | sort -u | head -40 > "$out.hosts.txt" || true
            echo "-- hosts in asset: $(wc -l < "$out.hosts.txt")"
            head -20 "$out.hosts.txt"
          done < /tmp/assetlist.txt

          # 2. Every URL literal in the FULL decompile (the local dump was partial).
          grep -rhoE '(https?|wss?|tg)://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]{4,200}' java --include=*.java 2>/dev/null \
            | sort -u > "analysis/hunt/urls-full.txt" || true
          echo "url literals: $(wc -l < "analysis/hunt/urls-full.txt")"
          head -60 "analysis/hunt/urls-full.txt"

          # 3. Where the App Engine bucket string is used.
          grep -rn "appspot\|google_storage_bucket" java --include=*.java 2>/dev/null \
            | head -40 > "analysis/hunt/appspot-usage.txt" || true
          cat "analysis/hunt/appspot-usage.txt"

          # 4. Server-list vocabulary anywhere in the tree.
          grep -rn -iE "serverlist|server_list|getServers|loadServers|serversJson|listServers|rawServers" \
            java --include=*.java 2>/dev/null | head -80 > "analysis/hunt/server-words.txt" || true
          echo "server-word hits: $(wc -l < "analysis/hunt/server-words.txt")"
          head -40 "analysis/hunt/server-words.txt"

          # 5. Bodies of the classes that actually open sockets or read the assets.
          : > "analysis/hunt/network-code.txt"
          grep -rlE "HttpURLConnection|OkHttpClient|openConnection|new URL\(|getAssets\(|server\.psi" \
            java --include=*.java 2>/dev/null | grep -viE '/(androidx|com/google|com/facebook|kotlin|okhttp3|okio)/' \
            | head -40 | while read -r f; do
              echo "##### $f" >> "analysis/hunt/network-code.txt"
              sed -n '1,140p' "$f" >> "analysis/hunt/network-code.txt"
            done
          echo "network-code lines: $(wc -l < "analysis/hunt/network-code.txt")"

          # 6. What the app asks its own backend for (strings near http).
          grep -rn -B3 -A3 '"http' java --include=*.java 2>/dev/null | head -60 > "analysis/hunt/http-literals.txt" || true

      - name: Trace the config decryption routine
        continue-on-error: true
        run: |
          exec > >(tee -a analysis/config-trace.log) 2>&1
          set -uo pipefail
          mkdir -p analysis/hunt

          # Ids used by the class that holds BD NET's config endpoint and the
          # two 40-hex secrets, plus the engine selectors.
          IDS='163397067700107|163710600312715|163805089593227|163981183252363|98422802446219|85516425721739|85550785460107|49932621674379|49966981412747'
          grep -rlE "$IDS" java --include=*.java 2>/dev/null | head -30 > /tmp/cfgfiles.txt || true
          echo "=== files touching the config ids: $(wc -l < /tmp/cfgfiles.txt)"
          cat /tmp/cfgfiles.txt
          : > analysis/hunt/config-code.txt
          while read -r f; do
            echo "##### $f" >> analysis/hunt/config-code.txt
            sed -n '1,220p' "$f" >> analysis/hunt/config-code.txt
          done < /tmp/cfgfiles.txt

          # Anything that instantiates a cipher, keyed hash or stream.
          grep -rlE 'Cipher\.getInstance|SecretKeySpec|IvParameterSpec|MessageDigest\.getInstance|GCMParameterSpec|KeyGenerator' \
            java --include=*.java 2>/dev/null \
            | grep -viE '/(androidx|com/google|com/facebook|kotlin/|ads_mobile_sdk|okhttp3|org/chromium)/' \
            | head -30 > /tmp/cryptofiles.txt || true
          echo "=== crypto files: $(wc -l < /tmp/cryptofiles.txt)"
          cat /tmp/cryptofiles.txt
          : > analysis/hunt/crypto-code.txt
          while read -r f; do
            echo "##### $f" >> analysis/hunt/crypto-code.txt
            sed -n '1,220p' "$f" >> analysis/hunt/crypto-code.txt
          done < /tmp/cryptofiles.txt

          # Base64.decode sites in app code - the configs arrive base64 wrapped.
          grep -rn 'Base64\.decode' java --include=*.java 2>/dev/null \
            | grep -viE '/(androidx|com/google|com/facebook|kotlin/|ads_mobile_sdk|okhttp3|org/chromium)/' \
            | head -40 > analysis/hunt/base64-sites.txt || true
          cat analysis/hunt/base64-sites.txt

          echo "config-code lines: $(wc -l < analysis/hunt/config-code.txt)"
          echo "crypto-code lines: $(wc -l < analysis/hunt/crypto-code.txt)"

      - name: Find the config decryptor in smali
        continue-on-error: true
        run: |
          exec > >(tee -a analysis/smali-trace.log) 2>&1
          set -uo pipefail
          mkdir -p analysis/hunt
          echo "smali roots: $(find decoded -maxdepth 1 -type d 2>/dev/null | wc -l)"
          find decoded -maxdepth 1 -type d 2>/dev/null | head

          # The two 40-hex secrets and the config URL as 64-bit literals.
          : > analysis/hunt/smali-secret-users.txt
          for lit in 0xffff6b0527d28875 0xffff6adc27d28875 0xffff6b6427d28875; do
            echo "### $lit" >> analysis/hunt/smali-secret-users.txt
            grep -rl "$lit" decoded --include=*.smali 2>/dev/null | head -10 >> analysis/hunt/smali-secret-users.txt || true
          done
          cat analysis/hunt/smali-secret-users.txt

          # Who calls the AES helper, and what does the helper look like?
          grep -rl "heIran;->decrypt\|heIran;->generateKey" decoded --include=*.smali 2>/dev/null \
            | head -10 > analysis/hunt/heiran-callers.txt || true
          cat analysis/hunt/heiran-callers.txt
          : > analysis/hunt/heiran-body.txt
          find decoded -path '*smalihelper/heIran.smali' 2>/dev/null | while read -r f; do
            echo "##### $f" >> analysis/hunt/heiran-body.txt
            cat "$f" >> analysis/hunt/heiran-body.txt
          done
          grep -c . analysis/hunt/heiran-body.txt || true

          # Any smali that mentions the config repository or its file names.
          grep -rl "BDNET2023\|JSONDNSTT\|JSONFASTDNS\|raw.githubusercontent" decoded --include=*.smali 2>/dev/null \
            | head -20 > analysis/hunt/config-smali-files.txt || true
          cat analysis/hunt/config-smali-files.txt
          : > analysis/hunt/config-smali-bodies.txt
          head -10 analysis/hunt/config-smali-files.txt | while read -r f; do
            echo "##### $f" >> analysis/hunt/config-smali-bodies.txt
            grep -n -B8 -A25 "BDNET2023\|JSONDNSTT\|JSONFASTDNS\|raw.githubusercontent" "$f" \
              >> analysis/hunt/config-smali-bodies.txt
          done
          echo "config smali bodies: $(wc -l < analysis/hunt/config-smali-bodies.txt)"

          # Bodies of classes that hold those constants but that jadx skipped.
          : > analysis/hunt/secret-smali-bodies.txt
          grep -rl "0xffff6b0527d28875\|0xffff6adc27d28875\|0xffff6b6427d28875" decoded --include=*.smali 2>/dev/null \
            | head -10 | while read -r f; do
              echo "##### $f" >> analysis/hunt/secret-smali-bodies.txt
              cat "$f" >> analysis/hunt/secret-smali-bodies.txt
            done

      - name: Mine native DNS-tunnel libraries
        continue-on-error: true
        run: |
          exec > >(tee -a analysis/native-libs.log) 2>&1
          set -uxo pipefail
          mkdir -p analysis/native
          for apk in apks/*.apk amtunnel.apk; do
            [ -f "$apk" ] || continue
            abi_label=$(basename "$apk" .apk)
            for lib in $(unzip -Z1 "$apk" | grep -E '\.so$' | grep -Ei 'dns|pdns|udpq|tun2socks|wg|super' || true); do
              base=$(basename "$lib" .so)
              out="analysis/native/${base}.strings.txt"
              echo "== $apk :: $lib"
              if ! python3 tools/extract_apk_entry.py "$apk" "$lib" "/tmp/${base}.so"; then
                echo "SKIP $lib (extraction failed)"
                continue
              fi
              strings -a -n 5 "/tmp/${base}.so" | sort -u > "$out" || true
              wc -l "$out"
              # everything that looks like a hostname / domain used by the tunnel
              grep -Eio '([a-z0-9][a-z0-9-]{1,62}\.)+(com|net|org|io|xyz|top|site|online|vip|app|dev|cloud|link|live|pro|cc|tk|ru|ir|info|tech|store|fun|space|website|icu|cyou|cfd|click|shop|club|host|press|world|life|today|network|digital|sbs|bond|rest|bar|monster|quest|buzz)' "$out" \
                | sort -u > "analysis/native/${base}.domains.txt" || true
              echo "-- domains in ${base}: $(wc -l < "analysis/native/${base}.domains.txt")"
              head -20 "analysis/native/${base}.domains.txt" || true
              # protocol-ish tokens
              grep -iE 'qname|base36|base64|chunk|fragment|session|cookie|handshake|socks|mtu|packet|sequence|checksum|encrypt|decrypt|xor|chacha|aes|tunnel|resolver|authoritative|txt|edns|compress' "$out" \
                | grep -vE '^(__|_ZN|_Z)' | head -200 > "analysis/native/${base}.keywords.txt" || true
              wc -l "analysis/native/${base}.keywords.txt"
            done
          done
          echo "=== summary ==="
          ls -l analysis/native/ | head -40
          echo "=== libs in bundle ==="
          for apk in apks/*.apk; do echo "-- $apk"; unzip -Z1 "$apk" | grep '\.so$' | head -30; done

      - name: Static analysis
        run: |
          exec > >(tee -a analysis/apk_analysis.log) 2>&1
          set -uxo pipefail
          ls -l amtunnel.apk
          extras=""
          while read -r split; do
            [ -n "$split" ] && extras="$extras --extra-apk $split"
          done < split-apks.txt || true
          # shellcheck disable=SC2086
          python3 tools/apk_analysis.py --apk amtunnel.apk $extras --out analysis
          echo "--- domains found ---"
          head -40 analysis/domains.txt || true
          echo "--- protocol hints ---"
          head -60 analysis/keywords.txt || true

      - name: Shrink report before committing
        run: |
          set -uo pipefail
          # keep the committed report small; the full dump goes to the artifact
          mkdir -p analysis-full
          cp -a analysis/. analysis-full/ 2>/dev/null || true
          for f in analysis/strings-all.txt analysis/classes.txt; do
            [ -f "$f" ] || continue
            head -c 900000 "$f" > "$f.cut" && mv "$f.cut" "$f"
          done
          # cap the decompiled sources at ~4 MB total
          if [ -d analysis/sources ]; then
            du -sh analysis/sources
            while [ "$(du -sm analysis/sources | cut -f1)" -gt 4 ]; do
              victim=$(find analysis/sources -name '*.java' -size +20k | head -1)
              [ -n "$victim" ] || break
              rm -f "$victim"
            done
          fi
          du -sh analysis
          find analysis -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2 | head -60

      - name: Upload detailed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amtunnel-apk-analysis
          path: |
            amtunnel.apk
            analysis-full/
          retention-days: 30
          if-no-files-found: warn

      - name: Relocate report
        if: always()
        run: |
          set -euo pipefail
          if [ "$OUT_DIR" != "analysis" ] && [ -d analysis ]; then
            rm -rf "$OUT_DIR"
            cp -a analysis "$OUT_DIR"
            echo "report copied to $OUT_DIR"
          fi

      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name "AM Tunnel CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f "$OUT_DIR" || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "APK analysis: refresh static report from $(sha256sum amtunnel.apk | cut -c1-12)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish download diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, glob, urllib.request
          parts = []
          out = os.environ.get("OUT_DIR", "analysis")
          for path in ("download.log", "unpack.log",
                       f"{out}/deobfuscate.log", f"{out}/native-libs.log", f"{out}/apk_analysis.log",
                       f"{out}/apktool.log", f"{out}/jadx.log", f"{out}/badging.txt"):
              if os.path.exists(path):
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      parts.append(f"\n===== {path} =====\n" + fh.read()[-20000:])
          if not parts:
              parts = ["(no logs captured)"]
          summary = "".join(parts)[-60000:]
          payload = {
              "name": "apk-download-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "APK download diagnostics", "summary": summary},
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode(), method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          print("check-run status:", urllib.request.urlopen(req).status)
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## AM Tunnel APK analysis"
            echo ""
            echo "- SHA-256: $(sha256sum amtunnel.apk | cut -d' ' -f1)"
            echo "- Committed report: \`analysis/\`"
            echo ""
            echo "### Top domains"
            echo '```'
            head -25 analysis/domains.txt 2>/dev/null || echo "n/a"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
