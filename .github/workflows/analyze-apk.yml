name: AM Tunnel APK analysis

# The agent sandbox cannot reach filebin.net or GitHub release assets, but a
# GitHub runner can. This workflow downloads the original AM Tunnel APK,
# decompiles it and commits a compact text report back to the branch so the
# findings can be read (and acted on) from the sandbox.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL of the AM Tunnel APK / zip"
        required: false
        default: "https://filebin.net/6kebb3eierc437j7/app.vpn.amtunnellite.zip"
  push:
    paths:
      - "tools/apk_analysis.py"
      - ".github/workflows/analyze-apk.yml"

permissions:
  contents: write
  checks: write

concurrency:
  group: analyze-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Download and decompile AM Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_URL: ${{ github.event.inputs.apk_url || 'https://filebin.net/6kebb3eierc437j7/app.vpn.amtunnellite.zip' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        continue-on-error: true
        run: |
          exec > >(tee -a download.log) 2>&1
          set -x
          mkdir -p apk
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          trY() {
            url="$1"; out="$2"
            echo "== trying $url"
            curl -sSL --connect-timeout 20 --max-time 900 -A "$UA" \
                 -H "Accept: application/octet-stream, application/vnd.android.package-archive, */*" \
                 -D "$out.headers" -o "$out" "$url"
            echo "curl exit: $?"
            head -25 "$out.headers" 2>/dev/null
            file "$out" 2>/dev/null
            ls -l "$out" 2>/dev/null
          }
          trY "$APK_URL" apk/candidate
          if ! file apk/candidate | grep -qi "zip archive"; then
            echo "== first attempt did not yield a zip; dumping beginning of body"
            head -c 2000 apk/candidate 2>/dev/null
            echo
            grep -oE 'href="[^"]+"' apk/candidate 2>/dev/null | head -20
            grep -oE 'https?://[^"<> ]+\.(zip|apk)[^"<> ]*' apk/candidate 2>/dev/null | head -10
          fi
          if ! file apk/candidate | grep -qi "zip archive"; then
            for url in \
              "https://d.apkpure.com/b/APK/app.vpn.amtunnellite?version=latest" \
              "https://d.apkpure.net/b/APK/app.vpn.amtunnellite?version=latest" \
              "https://apkpure.net/am-tunnel-lite-vpn/app.vpn.amtunnellite/download" \
              "https://apkcombo.app/am-tunnel-lite-vpn/app.vpn.amtunnellite/download/apk" \
              "https://apk.support/download/app.vpn.amtunnellite/latest" \
              "https://apkpure.com/am-tunnel-lite-vpn/app.vpn.amtunnellite/download"
            do
              trY "$url" apk/candidate2
              if file apk/candidate2 | grep -qi "zip archive"; then mv apk/candidate2 apk/candidate; break; fi
            done
          fi
          if file apk/candidate | grep -qi "zip archive"; then
            echo "DOWNLOAD_OK $(stat -c%s apk/candidate) bytes"
            cp apk/candidate download.bin
          else
            echo "DOWNLOAD_FAILED"
          fi

      - name: Unpack
        run: |
          exec > >(tee -a unpack.log) 2>&1
          set -euxo pipefail
          test -f download.bin || { echo "error: download.bin missing"; exit 1; }
          ls -l download.bin
          rm -rf unpacked
          mkdir -p unpacked
          # The download may be an APK itself (APK == zip) or a zip containing APKs.
          if unzip -Z1 download.bin | grep -qE '^(AndroidManifest\.xml|classes[0-9]*\.dex)$'; then
            echo "download is the APK itself"
            mkdir -p apks && cp download.bin apks/base.apk
          else
            unzip -o -q download.bin -d unpacked
            find unpacked -maxdepth 3 -type f -printf '%10s  %p\n' | sort -rn | head -30
            mkdir -p apks
            i=0
            while read -r line; do
              i=$((i+1)); cp "$line" "apks/split-$i.apk"
            done < <(find unpacked -name "*.apk" | sort)
          fi
          # The base APK is the one carrying dex + the manifest; splits only carry resources/libs.
          rm -f apks/base.apk.tmp
          for candidate in apks/*.apk; do
            if unzip -Z1 "$candidate" | grep -qE '^classes[0-9]*\.dex$'; then
              echo "base APK: $candidate"
              cp "$candidate" apks/base.apk.tmp
            fi
          done
          test -f apks/base.apk.tmp || {
            echo "error: no APK with dex found; candidates:"; ls -l apks
            exit 1
          }
          mv apks/base.apk.tmp amtunnel.apk
          rm -f apks/base.apk 2>/dev/null || true
          echo "--- all APKs in the bundle ---"
          for f in apks/*.apk; do
            printf '%10s  dex=%s  so=%s  %s\n' "$(stat -c%s "$f")" \
              "$(unzip -Z1 "$f" | grep -cE '^classes[0-9]*\.dex$')" \
              "$(unzip -Z1 "$f" | grep -c '\.so$')" "$f"
          done
          ls apks/*.apk | grep -v '^apks/base.apk$' > split-apks.txt || true
          wc -l < split-apks.txt
          ls -l amtunnel.apk
          sha256sum amtunnel.apk
          unzip -l amtunnel.apk | head -15
          echo "dex files: $(unzip -Z1 amtunnel.apk | grep -cE '^classes[0-9]*\.dex$')"
          echo "native libs: $(unzip -Z1 amtunnel.apk | grep -c '\.so$')"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install analysis tools
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq apktool jadx unzip zip > /dev/null 2>&1 || true
          if ! command -v apktool >/dev/null; then
            echo "installing apktool from upstream releases"
            curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar || true
            if [ -s /tmp/apktool.jar ]; then
              printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
              sudo chmod +x /usr/local/bin/apktool
            fi
          fi
          if ! command -v jadx >/dev/null; then
            echo "installing jadx from upstream releases"
            for version in 1.5.1 1.5.0 1.4.7; do
              if curl -fsSL -o /tmp/jadx.zip "https://github.com/skylot/jadx/releases/download/v${version}/jadx-${version}.zip"; then
                unzip -q -o /tmp/jadx.zip -d /opt/jadx && break
              fi
            done
            sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx 2>/dev/null || true
          fi
          command -v apktool && apktool --version || echo "apktool unavailable"
          command -v jadx && jadx --version || echo "jadx unavailable"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true

      - name: Decode manifest and resources
        run: |
          set -uo pipefail
          mkdir -p analysis
          AAPT2=$(ls /usr/local/lib/android/sdk/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging amtunnel.apk > analysis/badging.txt 2>&1 || true
            "$AAPT2" dump permissions amtunnel.apk > analysis/permissions.txt 2>&1 || true
            cat analysis/badging.txt | head -30
          fi
          apktool d -f -o decoded amtunnel.apk > analysis/apktool.log 2>&1 || true
          cp decoded/AndroidManifest.xml analysis/AndroidManifest.xml 2>/dev/null || true
          ls decoded 2>/dev/null | head -20 || true
          if [ -d decoded/res/values ]; then
            cp decoded/res/values/strings.xml analysis/res-strings.xml 2>/dev/null || true
          fi

      - name: Decompile with jadx
        continue-on-error: true
        run: |
          set -uo pipefail
          if command -v jadx >/dev/null; then
            timeout 1800 jadx -d java --no-res --threads-count 4 --show-bad-code amtunnel.apk > analysis/jadx.log 2>&1 || true
            find java -name "*.java" | wc -l || true
          else
            echo "jadx not available" | tee analysis/jadx.log
          fi

      - name: Extract smali of the application package
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p analysis/smali
          for dir in decoded/smali decoded/smali_classes*; do
            [ -d "$dir" ] || continue
            for pkg in app/vpn amtunnel vpn/amtunnel com/amtunnel; do
              if [ -d "$dir/$pkg" ]; then
                dest="analysis/smali/$(basename "$dir")/$(dirname "$pkg")"
                mkdir -p "$dest"
                cp -r "$dir/$pkg" "$dest/" 2>/dev/null || true
              fi
            done
          done
          du -sh analysis/smali 2>/dev/null || true

      - name: Collect keyword-matched sources
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p analysis/sources
          if [ -d java ]; then
            grep -rilE "dns|tunnel|vpn|resolver|base36|socks|handshake|encrypt" java \
              | head -400 > /tmp/matches.txt || true
            wc -l /tmp/matches.txt
            while read -r file; do
              dest="analysis/sources/$(dirname "${file#java/}")"
              mkdir -p "$dest"
              cp "$file" "$dest/" 2>/dev/null || true
            done < /tmp/matches.txt
            du -sh analysis/sources || true
          fi

      - name: Static analysis
        run: |
          exec > >(tee -a analysis/apk_analysis.log) 2>&1
          set -uxo pipefail
          ls -l amtunnel.apk
          extras=""
          while read -r split; do
            [ -n "$split" ] && extras="$extras --extra-apk $split"
          done < split-apks.txt || true
          # shellcheck disable=SC2086
          python3 tools/apk_analysis.py --apk amtunnel.apk $extras --out analysis
          echo "--- domains found ---"
          head -40 analysis/domains.txt || true
          echo "--- protocol hints ---"
          head -60 analysis/keywords.txt || true

      - name: Shrink report before committing
        run: |
          set -uo pipefail
          # keep the committed report small; the full dump goes to the artifact
          mkdir -p analysis-full
          cp -a analysis/. analysis-full/ 2>/dev/null || true
          for f in analysis/strings-all.txt analysis/classes.txt; do
            [ -f "$f" ] || continue
            head -c 900000 "$f" > "$f.cut" && mv "$f.cut" "$f"
          done
          # cap the decompiled sources at ~4 MB total
          if [ -d analysis/sources ]; then
            du -sh analysis/sources
            while [ "$(du -sm analysis/sources | cut -f1)" -gt 4 ]; do
              victim=$(find analysis/sources -name '*.java' -size +20k | head -1)
              [ -n "$victim" ] || break
              rm -f "$victim"
            done
          fi
          du -sh analysis
          find analysis -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2 | head -60

      - name: Upload detailed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amtunnel-apk-analysis
          path: |
            amtunnel.apk
            analysis-full/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name "AM Tunnel CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f analysis || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "APK analysis: refresh static report from $(sha256sum amtunnel.apk | cut -c1-12)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish download diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, glob, urllib.request
          parts = []
          for path in ("download.log", "unpack.log", "analysis/apk_analysis.log",
                       "analysis/apktool.log", "analysis/jadx.log", "analysis/badging.txt"):
              if os.path.exists(path):
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      parts.append(f"\n===== {path} =====\n" + fh.read()[-20000:])
          if not parts:
              parts = ["(no logs captured)"]
          summary = "".join(parts)[-60000:]
          payload = {
              "name": "apk-download-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "APK download diagnostics", "summary": summary},
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode(), method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          print("check-run status:", urllib.request.urlopen(req).status)
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## AM Tunnel APK analysis"
            echo ""
            echo "- SHA-256: $(sha256sum amtunnel.apk | cut -d' ' -f1)"
            echo "- Committed report: \`analysis/\`"
            echo ""
            echo "### Top domains"
            echo '```'
            head -25 analysis/domains.txt 2>/dev/null || echo "n/a"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
