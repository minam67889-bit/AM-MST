name: Ultra Tunnel - dnstt toolchain self-test

# Proves the exact client build used for the Ultra probes really can move bytes
# through a dnstt tunnel: spin up dnstt-server locally, point dnstt-client at it
# over UDP, and fetch a real HTTP page through the resulting SOCKS5 proxy.
# Without this control, "no answer from Ultra's servers" would be meaningless.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ultra-selftest.yml"

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build dnstt
        run: |
          set -e
          git clone --depth 1 https://github.com/Mygod/dnstt.git /tmp/dt
          cd /tmp/dt
          go build -o /tmp/dnstt-client ./dnstt-client
          go build -o /tmp/dnstt-server ./dnstt-server
          /tmp/dnstt-server -gen-key -privkey-file /tmp/server.key -pubkey-file /tmp/server.pub
          ls -l /tmp/server.key /tmp/server.pub

      - name: Tunnel a real page through it
        run: |
          set +e
          OUT=analysis-ultra/report/selftest.txt
          : > "$OUT"
          (cd /tmp && mkdir -p www && echo "dnstt self-test page" > www/index.html && \
             python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/h.log 2>&1) &
          http=$!
          # dnstt-server takes: <domain> <upstream host:port>; every stream is
          # forwarded to that fixed upstream, which is how Ultra's servers are
          # configured too (they forward to their own sshd).
          /tmp/dnstt-server -udp 127.0.0.1:5300 -privkey-file /tmp/server.key \
                            t.example.com 127.0.0.1:8080 > /tmp/s.log 2>&1 &
          srv=$!
          sleep 3
          /tmp/dnstt-client -udp 127.0.0.1:5300 -pubkey-file /tmp/server.pub \
                            t.example.com 127.0.0.1:2222 > /tmp/c.log 2>&1 &
          cli=$!
          sleep 4
          python3 analysis-ultra/probe_dnstt.py 127.0.0.1 >> "$OUT" 2>&1
          echo "--- client log" >> "$OUT"; tail -10 /tmp/c.log | sed 's/^/  /' >> "$OUT"
          echo "--- server log" >> "$OUT"; tail -10 /tmp/s.log | sed 's/^/  /' >> "$OUT"
          kill $cli $srv $http 2>/dev/null
          cat "$OUT"

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-accounts[bot]@users.noreply.github.com"
          git add analysis-ultra
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "ultra: dnstt toolchain self-test [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" > /dev/null 2>&1
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
