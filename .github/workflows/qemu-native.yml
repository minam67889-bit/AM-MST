name: Native BD client under qemu

# The only way left to prove a byte moves through the tunnel: run the app's own
# tunnel binaries, unmodified. They are Android/arm64 PIE executables whose
# interpreter is /system/bin/linker64, so they are executed with
# qemu-aarch64-static and a sysroot that maps the bionic names onto glibc plus
# stubs for the two bionic-only libs they need (liblog, libandroid).
#
# Everything is wrapped in `timeout` - a Go tunnel client that starts fine and
# then waits forever must not eat the job again.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "FastDNS / SlowDNS endpoint"
        default: "173.212.232.241"
      slowdns_host:
        description: "SlowDNS endpoint"
        default: "13.140.185.158"
  push:
    paths:
      - ".github/workflows/qemu-native.yml"
      - "tools/tunnel_probe.py"

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FASTDNS_HOST: ${{ inputs.host || '173.212.232.241' }}
      SLOWDNS_HOST: ${{ inputs.slowdns_host || '13.140.185.158' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross \
            gcc-aarch64-linux-gnu unzip binutils file
          qemu-aarch64-static --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee /tmp/apk.txt) 2>&1
          mkdir -p art libs
          run=$(gh run list --workflow=analyze-apk.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
          echo "analysis run: $run"
          art=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                  --jq '.artifacts[] | select(.name=="amtunnel-apk-analysis") | .id' | head -1 || true)
          echo "artifact: $art"
          if [ -n "${art:-}" ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > art/a.zip || true
            file art/a.zip || true
            unzip -o -q art/a.zip -d art/x || true
          fi
          if ! find art -name '*.apk' | grep -q .; then
            echo "falling back to gh run download"
            gh run download "$run" -n amtunnel-apk-analysis -D art/dl -R "$GITHUB_REPOSITORY" || true
          fi
          apk=$(find art -name '*.apk' | head -1 || true)
          echo "APK=$apk"
          if [ -z "$apk" ]; then echo "NO APK"; exit 1; fi
          unzip -o -j "$apk" 'lib/arm64-v8a/*' -d libs || true
          chmod +x libs/* 2>/dev/null || true
          ls -l libs

      - name: "Sysroot - glibc loader plus bionic stubs"
        run: |
          set -euo pipefail
          mkdir -p sysroot/system/bin sysroot/system/lib64
          ln -sf /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 sysroot/system/bin/linker64
          for lib in libc.so.6 libdl.so.2 libm.so.6 libpthread.so.0 librt.so.1; do
            ln -sf "/usr/aarch64-linux-gnu/lib/$lib" "sysroot/system/lib64/${lib%%.so*}.so"
          done
          cat > /tmp/stubs.c <<'EOF'
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>
          int __android_log_print(int p, const char *t, const char *f, ...) {
            va_list a; va_start(a, f); if (t) fprintf(stderr, "%s: ", t);
            vfprintf(stderr, f, a); fputc('\n', stderr); va_end(a); return 0; }
          int __android_log_write(int p, const char *t, const char *s) {
            fprintf(stderr, "%s: %s\n", t ? t : "android", s); return 0; }
          int __android_log_vprint(int p, const char *t, const char *f, va_list a) {
            vfprintf(stderr, f, a); return 0; }
          int __android_log_assert(const char *c, const char *t, const char *f, ...) {
            va_list a; va_start(a, f); vfprintf(stderr, f, a); va_end(a); return 0; }
          void android_set_abort_message(const char *m) {
            fprintf(stderr, "abort: %s\n", m ? m : ""); }
          int __system_property_get(const char *n, char *v) { strcpy(v, ""); return 0; }
          int __system_property_find(const char *n) { return -1; }
          EOF
          aarch64-linux-gnu-gcc -shared -fPIC -O1 -o sysroot/system/lib64/liblog.so /tmp/stubs.c
          cp sysroot/system/lib64/liblog.so sysroot/system/lib64/libandroid.so
          ls -l sysroot/system/lib64

      - name: "Does it start at all?"
        run: |
          exec > >(tee /tmp/startup.txt) 2>&1
          set +e            # GitHub runs bash -e: one failed probe killed the step
          set -x
          date -u
          qemu-aarch64-static --version | head -1
          printf 'int main(void){return 0;}' > /tmp/t.c
          aarch64-linux-gnu-gcc -o /tmp/t /tmp/t.c
          timeout 15 qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/t; echo "trivial via cross loader exit=$?"
          export QEMU_LD_PREFIX="$PWD/sysroot"
          export LD_LIBRARY_PATH="$PWD/sysroot/system/lib64"
          ls -l sysroot/system/bin sysroot/system/lib64
          aarch64-linux-gnu-gcc -o /tmp/td /tmp/t.c
          timeout 15 qemu-aarch64-static -L "$PWD/sysroot" /tmp/td; echo "trivial shimmed exit=$?"
          for bin in libxdnstt libdns; do
            for flag in -h --help -version; do
              echo "===== $bin $flag"
              timeout 25 qemu-aarch64-static "libs/$bin.so" "$flag" 2>&1 | head -30
              echo "[pipeline exit ${PIPESTATUS[*]}]"
            done
          done
          set +x
          echo "done"

      - name: "their FastDNS client: -udp host:53 -pubkey prince sd-<host> 127.0.0.1:7000"
        run: |
          set +e
          set -uo pipefail
          export QEMU_LD_PREFIX="$PWD/sysroot"
          export LD_LIBRARY_PATH="$PWD/sysroot/system/lib64"
          : > /tmp/xdnstt-run.txt
          echo "== host $FASTDNS_HOST" >> /tmp/xdnstt-run.txt
          timeout 180 qemu-aarch64-static libs/libxdnstt.so \
            -udp "$FASTDNS_HOST:53" -report BDNET -pubkey prince \
            "sd-$FASTDNS_HOST" 127.0.0.1:7000 > /tmp/xdnstt.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            ss -ltn 2>/dev/null | grep -q ":7000" && { echo "listener up after ${i}s" >> /tmp/xdnstt-run.txt; break; }
            sleep 1
          done
          ss -ltnp 2>/dev/null | grep 7000 >> /tmp/xdnstt-run.txt || echo "no listener on 7000" >> /tmp/xdnstt-run.txt
          echo "== client log" >> /tmp/xdnstt-run.txt
          cat /tmp/xdnstt.log >> /tmp/xdnstt-run.txt
          for mode in socks http raw; do
            timeout 70 python3 tools/tunnel_probe.py 127.0.0.1:7000 --mode $mode \
              --timeout 30 --wait 5 >> /tmp/xdnstt-run.txt 2>&1 || true
          done
          echo "== client log after the probes" >> /tmp/xdnstt-run.txt
          cat /tmp/xdnstt.log >> /tmp/xdnstt-run.txt
          kill $pid 2>/dev/null || true
          cat /tmp/xdnstt-run.txt

      - name: "their SlowDNS client: -tunnel <pEncrypt(ip:53)> -report BDNET"
        run: |
          set +e
          set -uo pipefail
          export QEMU_LD_PREFIX="$PWD/sysroot"
          export LD_LIBRARY_PATH="$PWD/sysroot/system/lib64"
          ENC=$(python3 -c "import sys; sys.path.insert(0,'tools'); import bdnet_dns as b; print(b.p_encrypt('${SLOWDNS_HOST}:53'))")
          : > /tmp/libdns-run.txt
          echo "== $SLOWDNS_HOST encrypted=$ENC" >> /tmp/libdns-run.txt
          timeout 180 qemu-aarch64-static libs/libdns.so \
            -tunnel "$ENC" -report BDNET > /tmp/libdns.log 2>&1 &
          pid=$!
          sleep 30
          echo "== log" >> /tmp/libdns-run.txt; cat /tmp/libdns.log >> /tmp/libdns-run.txt
          echo "== listening ports" >> /tmp/libdns-run.txt
          ss -ltnp 2>/dev/null >> /tmp/libdns-run.txt
          for port in 53 7000 1080 1081 8080 9050 9000 1053 5353 8053; do
            if ss -ltn 2>/dev/null | grep -q ":$port "; then
              echo "== port $port open, probing" >> /tmp/libdns-run.txt
              timeout 45 python3 tools/tunnel_probe.py "127.0.0.1:$port" --mode socks --timeout 20 >> /tmp/libdns-run.txt 2>&1 || true
              timeout 45 python3 tools/tunnel_probe.py "127.0.0.1:$port" --mode http --timeout 20 >> /tmp/libdns-run.txt 2>&1 || true
              timeout 45 python3 - "$port" <<'PY' >> /tmp/libdns-run.txt 2>&1 || true
          import socket, sys, struct, random
          port = int(sys.argv[1])
          q = struct.pack(">HHHHHH", random.randrange(65535), 0x0100, 1, 0, 0, 0)
          q += b"\x07example\x03com\x00" + struct.pack(">HH", 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(15)
          s.sendto(q, ("127.0.0.1", port))
          try:
              data, _ = s.recvfrom(4096)
              print(f"DNS query through the tunnel returned {len(data)} bytes: {data[:40].hex()}")
          except socket.timeout:
              print("DNS query through the tunnel: no answer")
          PY
            fi
          done
          echo "== log after probes" >> /tmp/libdns-run.txt; cat /tmp/libdns.log >> /tmp/libdns-run.txt
          kill $pid 2>/dev/null || true
          cat /tmp/libdns-run.txt

      - name: Publish
        if: always()
        continue-on-error: true
        run: |
          mkdir -p analysis-bdnet/configs/dns/results
          for f in apk startup xdnstt-run libdns-run xdnstt libdns; do
            [ -f "/tmp/$f.txt" ] && cp "/tmp/$f.txt" "analysis-bdnet/configs/dns/results/qemu-$f.txt"
            [ -f "/tmp/$f.log" ] && cp "/tmp/$f.log" "analysis-bdnet/configs/dns/results/qemu-$f.log"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-bdnet/configs/dns/results
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "dns: qemu run of the app's own tunnel clients [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
