name: BD SlowDNS - direct vs public-resolver transport

# Question this answers: can the tunnel be driven through a public recursive
# resolver (8.8.8.8:53) instead of straight at the server's own IP? That is what
# makes SlowDNS work on networks that only allow DNS to a resolver - and it is
# how Ultra's catalogue routes its "Slow DNS" networks (carrier resolvers).
#
# Control: the same client against the server IP, which we know works.
# Both runs use BD's own unmodified libxdnstt.so under qemu.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bd-resolver.yml"

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static unzip binutils file dnsutils curl

      - name: BD APK
        run: |
          set +e
          mkdir -p libs art && cd art
          URL="https://filebin.net/idukzq7kugvrtcau/BDNET.VPN%20v106%20Mod.zip"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -c jar -A "$UA" -o /dev/null "$URL"
          curl -sSL -c jar -b jar -A "$UA" -H "Referer: $URL" -o bd.zip "$URL"
          file bd.zip; ls -l bd.zip
          unzip -o -q bd.zip -d x || true
          ls x | head
          apk=$(find x -name '*.apk' | head -1)
          echo "APK=$apk"
          [ -z "$apk" ] && exit 1
          unzip -o -j "$apk" 'lib/arm64-v8a/*' -d ../libs
          chmod +x ../libs/* 2>/dev/null
          ls -l ../libs | head

      - name: Sysroot (real bionic from an arm64 image)
        run: |
          set +e
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "system-images;android-24;default;arm64-v8a" 2>&1 | tail -3
          IMGDIR=$(find "$ANDROID_HOME" -type d -path '*android-24*arm64-v8a*' | head -1)
          IMGFILE="$IMGDIR/system.img"
          mkdir -p sysroot/system/bin sysroot/system/lib64
          if sudo mount -o loop,ro "$IMGFILE" /mnt; then
            sudo cp /mnt/bin/linker64 sysroot/system/bin/
            sudo cp -a /mnt/lib64/*.so sysroot/system/lib64/
            sudo umount /mnt
          else
            sudo chmod 644 "$IMGFILE"
            for f in bin/linker64 lib64/libc.so lib64/libdl.so lib64/libm.so lib64/liblog.so; do
              debugfs -R "dump /$f /tmp/x.bin" "$IMGFILE" > /dev/null 2>&1 && \
                sudo mv /tmp/x.bin "sysroot/system/$f"
            done
          fi
          sudo chown -R "$USER" sysroot
          ls sysroot/system/bin sysroot/system/lib64 | head

      - name: Direct vs resolver
        run: |
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          OUT="$GITHUB_WORKSPACE/analysis-bdnet/report/transport-compare.txt"
          mkdir -p "$(dirname "$OUT")"; : > "$OUT"
          run() {
            label="$1"; transport="$2"; port="$3"
            echo "==== $label (-udp $transport:53)" >> "$OUT"
            timeout 120 qemu-aarch64-static libs/libxdnstt.so \
              -udp "$transport:53" -report "BD NET VPN" -pubkey prince \
              sd-de1.liftmeon.org 127.0.0.1:$port > /tmp/x_$port.log 2>&1 &
            pid=$!
            sleep 25
            python3 tools/far_end_greeting.py "$port" >> "$OUT" 2>&1
            kill $pid 2>/dev/null; wait $pid 2>/dev/null
            echo "  client log:" >> "$OUT"
            tail -6 /tmp/x_$port.log | sed 's/^/    /' >> "$OUT"
            echo >> "$OUT"
          }
          run "direct to server IP" "13.140.185.158" 7010
          run "through Google resolver" "8.8.8.8" 7011
          run "through Google resolver (2nd host)" "8.8.8.8" 7012
          cat "$OUT"

      - name: Publish
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-accounts[bot]@users.noreply.github.com"
          git add analysis-bdnet
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "bd: direct vs public-resolver transport [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" > /dev/null 2>&1
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
