name: Android build, tests and tunnel integration

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "analysis/**"
      - "analysis-*/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile all modules, run unit tests, build debug APK
        run: |
          set -o pipefail
          gradle :core:test :integration:compileTestKotlin :app:assembleDebug \
            --continue --no-daemon --stacktrace 2>&1 | tee -a build.log


      - name: Build release APK (signed if secrets are present)
        env:
          AMTUNNEL_KEYSTORE: ${{ secrets.AMTUNNEL_KEYSTORE_PATH }}
          AMTUNNEL_KEYSTORE_PASSWORD: ${{ secrets.AMTUNNEL_KEYSTORE_PASSWORD }}
          AMTUNNEL_KEY_ALIAS: ${{ secrets.AMTUNNEL_KEY_ALIAS }}
          AMTUNNEL_KEY_PASSWORD: ${{ secrets.AMTUNNEL_KEY_PASSWORD }}
        run: |
          if [ -n "$AMTUNNEL_KEYSTORE" ] && [ -f "$AMTUNNEL_KEYSTORE" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            echo "No signing secrets configured - release APK skipped, debug APK is the deliverable."
          fi

      - name: Verify APK contents
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "error: debug APK missing"; exit 1; }
          AAPT2=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "using $AAPT2"
          "$AAPT2" dump badging "$APK" | tee apk-badging.txt > /dev/null
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > apk-manifest.txt
          check() {
            if grep -Eq -- "$1" apk-badging.txt apk-manifest.txt; then
              echo "ok: $2"
            else
              echo "error: APK check failed - $2"
              exit 1
            fi
          }
          check "package: name='io\.amtunnel\.app\.debug'" "debug applicationId"
          check "android\.permission\.INTERNET" "INTERNET permission"
          check "android\.permission\.FOREGROUND_SERVICE" "foreground service permission"
          check "TunnelVpnService" "VpnService declared"
          check "android\.net\.VpnService" "VPN intent filter"
          check "MainActivity" "launcher activity"
          check "(sdk|minSdk)Version:'26'" "minSdk 26"
          check "targetSdkVersion:'34'" "targetSdk 34"
          found=0
          for dex in $(unzip -Z1 "$APK" | grep -E "^classes[0-9]*\.dex$"); do
            if unzip -p "$APK" "$dex" | strings | grep -q "MasterDnsTransport"; then found=1; fi
            if unzip -p "$APK" "$dex" | strings | grep -q "TunnelVpnService"; then echo "ok: VPN service code in $dex"; fi
          done
          if [ "$found" -ne 1 ]; then echo "error: client transport classes are not in the APK"; exit 1; fi
          echo "ok: client transport packaged into the APK"
          echo "apk size: $(stat -c%s "$APK") bytes, sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "### APK verification"
            echo ""
            echo '```'
            grep -E "^(package|sdkVersion|targetSdkVersion)" apk-badging.txt || head -5 apk-badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            core/build/reports/tests/**
            core/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amtunnel-mst-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "No debug APK was produced - skipping release upload."
            exit 0
          fi
          SHA7=$(git rev-parse --short HEAD)
          TAG="apk-${GITHUB_RUN_NUMBER}-${SHA7}"
          cp "$APK" "/tmp/amtunnel-mst-${SHA7}.apk"
          gh release create "$TAG" "/tmp/amtunnel-mst-${SHA7}.apk#amtunnel-mst-debug-${SHA7}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AM Tunnel MST debug APK ($SHA7)" \
            --notes "Debug APK built by workflow run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${SHA7}\`. Install with \`adb install -r amtunnel-mst-debug-${SHA7}.apk\`. Debug-signed: not for production distribution. Server-side AM Tunnel infrastructure is unchanged; see docs/STATUS.md for what is verified."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amtunnel-mst-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo ""
            echo "- Debug APK: $(ls -1 app/build/outputs/apk/debug/*.apk 2>/dev/null || echo 'not produced')"
            echo "- Unit tests: $(grep -h 'tests=' core/build/test-results/test/*.xml 2>/dev/null | sed -E 's/.*tests="([0-9]+)".*failures="([0-9]+)".*/tests=\1 failures=\2/' | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build diagnostics (job logs are unreachable from the agent)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob, json, os, urllib.request, xml.etree.ElementTree as ET
          errors = []
          for path in glob.glob("*/build/test-results/test/*.xml"):
              try:
                  tree = ET.parse(path)
              except Exception:
                  continue
              for case in tree.iter("testcase"):
                  for fail in list(case.iter("failure")) + list(case.iter("error")):
                      msg = (fail.get("message") or "")[:400].replace("\n", " ")
                      errors.append(f"TEST FAILED: {case.get('classname')}.{case.get('name')} :: {msg}")
          tail = "(no build.log)"
          if os.path.exists("build.log"):
              with open("build.log", encoding="utf-8", errors="replace") as fh:
                  content = fh.read()
              # keep only lines that look like problems, plus a short tail
              interesting = [
                  line for line in content.splitlines()
                  if line.startswith(("e:", "error:", "FAILED", "FAILURE", "ok:", "using ", "package:", "sdkVersion", "BUILD"))
              ]
              tail = "\n".join(interesting[-120:]) + "\n---- raw tail ----\n" + content[-8000:]
          summary = "\n".join(errors[:60]) + "\n\n" + tail
          payload = {
              "name": "gradle-output",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "Gradle build diagnostics", "summary": summary[:65000]},
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          print("check-run status:", urllib.request.urlopen(req).status)
          PY

  integration:
    name: Live DNS-tunnel integration
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build the reference DNS-tunnel server from source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/masterking32/MasterDnsVPN.git /tmp/mdvpn
          cd /tmp/mdvpn
          go build -trimpath -o /tmp/mdvpn-server ./cmd/server
          /tmp/mdvpn-server -version

      - name: Configure and start the tunnel server
        id: server
        run: |
          set -euo pipefail
          mkdir -p /tmp/md
          cat > /tmp/md/server_config.toml <<'EOF'
          DOMAIN = ["t.amtunnel.test"]
          PROTOCOL_TYPE = "SOCKS5"
          UDP_HOST = "127.0.0.1"
          UDP_PORT = 15353
          DATA_ENCRYPTION_METHOD = 1
          ENCRYPTION_KEY_FILE = "/tmp/md/encryption_key.txt"
          MAX_PACKETS_PER_BATCH = 10
          EOF
          nohup /tmp/mdvpn-server -config /tmp/md/server_config.toml -nowait > /tmp/md/server.log 2>&1 &
          echo $! > /tmp/md/server.pid
          for i in $(seq 1 40); do
            if [ -s /tmp/md/encryption_key.txt ]; then break; fi
            sleep 0.5
          done
          sleep 2
          if ! kill -0 "$(cat /tmp/md/server.pid)"; then
            echo "server failed to start"; cat /tmp/md/server.log; exit 1
          fi
          KEY=$(tr -d '[:space:]' < /tmp/md/encryption_key.txt)
          echo "key length: ${#KEY}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "--- server log (head) ---"
          head -30 /tmp/md/server.log

      - name: Run tunnel integration tests
        env:
          AMTUNNEL_IT: "1"
          AMTUNNEL_DOMAIN: t.amtunnel.test
          AMTUNNEL_SERVER_HOST: 127.0.0.1
          AMTUNNEL_SERVER_PORT: "15353"
          AMTUNNEL_ENC: "1"
          AMTUNNEL_KEY: ${{ steps.server.outputs.key }}
        run: |
          set -o pipefail
          { echo "=== tunnel server log (before tests) ==="; tail -60 /tmp/md/server.log || true; } | tee -a build.log
          gradle :integration:test --no-daemon --stacktrace --info 2>&1 | tee -a build.log

      - name: Server log
        if: always()
        run: |
          { echo "=== tunnel server log (after tests) ==="; tail -300 /tmp/md/server.log || true; } | tee -a build.log

      - name: Publish integration diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob, json, os, urllib.request, xml.etree.ElementTree as ET
          errors = []
          for path in glob.glob("integration/build/test-results/test/*.xml"):
              try:
                  tree = ET.parse(path)
              except Exception:
                  continue
              for case in tree.iter("testcase"):
                  for fail in list(case.iter("failure")) + list(case.iter("error")):
                      msg = (fail.get("message") or "")[:600].replace("\n", " ")
                      errors.append(f"TEST FAILED: {case.get('classname')}.{case.get('name')} :: {msg}")
                      detail = (fail.text or "")[:1200]
                      if detail:
                          errors.append("  detail: " + detail.replace("\n", " | ")[:1200])
          tail = "(no build.log)"
          if os.path.exists("build.log"):
              with open("build.log", encoding="utf-8", errors="replace") as fh:
                  tail = fh.read()[-30000:]
          summary = "\n".join(errors[:80]) + "\n\n---- log tail ----\n" + tail
          payload = {
              "name": "integration-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "Integration test diagnostics", "summary": summary[:65000]},
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          print("check-run status:", urllib.request.urlopen(req).status)
          PY

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            integration/build/reports/tests/**
            integration/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Live tunnel integration"
            echo ""
            echo '```'
            grep -h -E "tunnel stats|failover stats|dns-only resolver|tests=" integration/build/test-results/test/*.xml 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
