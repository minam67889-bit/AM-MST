name: BD tunnel - real traffic proof

# The narrowest possible harness: run BD NET's own dnstt client under qemu,
# talk SOCKS5 to the port it opens with the credentials the app itself uses
# (tanginaka / wagditokupal, straight out of its LSParanoid string table), and
# ask for a real web page. Everything else is noise; this job answers one
# question: does a byte come back out of BD's tunnel?

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bd-tunnel.yml"

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BD_HOSTS: ${{ vars.BD_HOSTS || '13.140.185.158' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static unzip binutils file dnsutils curl

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee /tmp/apk.txt) 2>&1
          mkdir -p art libs
          run=$(gh run list --workflow=analyze-apk.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
          echo "analysis run: $run"
          art=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                  --jq '.artifacts[] | select(.name=="amtunnel-apk-analysis") | .id' | head -1 || true)
          if [ -n "${art:-}" ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > art/a.zip || true
            unzip -o -q art/a.zip -d art/x || true
          fi
          apk=$(find art -name '*.apk' | head -1 || true)
          echo "APK=$apk"
          [ -z "$apk" ] && exit 1
          unzip -o -j "$apk" 'lib/arm64-v8a/*' -d libs || true
          chmod +x libs/* 2>/dev/null || true
          ls -l libs | head

      - name: Sysroot
        run: |
          exec > >(tee /tmp/sysroot.txt) 2>&1
          set +e
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "system-images;android-24;default;arm64-v8a" 2>&1 | tail -3
          IMGDIR=$(find "$ANDROID_HOME" -type d -path '*android-24*arm64-v8a*' | head -1)
          IMGFILE="$IMGDIR/system.img"
          mkdir -p sysroot/system/bin sysroot/system/lib64
          if sudo mount -o loop,ro "$IMGFILE" /mnt; then
            sudo cp /mnt/bin/linker64 sysroot/system/bin/
            sudo cp -a /mnt/lib64/*.so sysroot/system/lib64/
            sudo umount /mnt
          else
            sudo chmod 644 "$IMGFILE"
            for f in bin/linker64 lib64/libc.so lib64/libdl.so lib64/libm.so lib64/liblog.so; do
              debugfs -R "dump /$f /tmp/x.bin" "$IMGFILE" > /dev/null 2>&1 && \
                sudo mv /tmp/x.bin "sysroot/system/$f"
            done
          fi
          sudo chown -R "$USER" sysroot
          ls sysroot/system/bin sysroot/system/lib64 | head

      - name: "What flags do the two clients actually take?"
        run: |
          exec > >(tee /tmp/flags.txt) 2>&1
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          for lib in libxdnstt libdns; do
            echo "================= $lib -h"
            timeout 20 qemu-aarch64-static "libs/$lib.so" -h 2>&1 | head -45
            echo "================= $lib --help"
            timeout 20 qemu-aarch64-static "libs/$lib.so" --help 2>&1 | head -25
            echo "================= flag-looking strings inside $lib"
            strings -n 3 "libs/$lib.so" | grep -xE "-[a-zA-Z][a-zA-Z0-9-]{1,18}" | sort -u | head -40
          done
          echo "================= does libdns parse the JSON config?"
          strings -n 6 libs/libdns.so | grep -iE "recv_window|confuse|validate|socks5|retry_interval|config.json|config" | head -25

      - name: "Real traffic through BD's tunnel"
        run: |
          exec > >(tee /tmp/bd-tunnel.txt) 2>&1
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          echo "=== libtun2socks CLI surface"
          strings -n 3 libs/libtun2socks.so | grep -xE "--[a-z-]{3,24}" | sort -u | head -30
          echo "=== strings that could be a user/pass pair (lowercase words, 6..16)"
          strings -n 6 libs/libtun2socks.so | grep -xE "[a-z]{6,16}" | sort -u | tr '\n' ' '; echo
          cat > /tmp/zoneprobe.py <<'PY'
          import socket, sys, time
          port = int(sys.argv[1])
          def once(prep, payload):
              t0 = time.time()
              try:
                  s = socket.create_connection(("127.0.0.1", port), 3); s.settimeout(6)
                  s.sendall(prep)
                  r1 = s.recv(2)
                  if payload:
                      s.sendall(payload); r2 = s.recv(2)
                  else:
                      r2 = b"-"
                  s.close()
                  return f"{r1.hex()}/{r2.hex() if isinstance(r2, bytes) else r2} in {1000*(time.time()-t0):.0f} ms"
              except Exception as e:
                  return f"{e!r}"
          u, p = b"tanginaka", b"wagditokupal"
          creds = bytes([1, len(u)]) + u + bytes([len(p)]) + p
          print(f"    noauth : {once(b'\x05\x01\x00', None)}")
          print(f"    creds  : {once(b'\x05\x02\x00\x02', creds)}")
          PY
          i=0
          for zone in sd-de1.liftmeon.org sd-de1 de1.liftmeon.org sd-aog1.liftmeon.org sd-aog1; do
            i=$((i+1)); port=$((7100+i))
            echo "================= zone=$zone  target=13.140.185.158:53  local=$port"
            timeout 120 qemu-aarch64-static libs/libxdnstt.so \
              -udp 13.140.185.158:53 -report "BD NET VPN" -pubkey prince \
              "$zone" 127.0.0.1:$port > /tmp/z$i.out 2>/tmp/z$i.err &
            pid=$!
            sleep 11
            ss -lntp 2>/dev/null | grep ":$port" | head -1
            python3 /tmp/zoneprobe.py $port
            kill $pid 2>/dev/null; wait $pid 2>/dev/null
          done
          echo "================= a full HTTP fetch attempt through each zone"
          i=0
          for zone in sd-de1.liftmeon.org sd-de1; do
            i=$((i+1)); port=$((7200+i))
            timeout 150 qemu-aarch64-static libs/libxdnstt.so \
              -udp 13.140.185.158:53 -report "BD NET VPN" -pubkey prince \
              "$zone" 127.0.0.1:$port > /tmp/y$i.out 2>/tmp/y$i.err &
            pid=$!
            sleep 11
            timeout 60 curl -sS -m 55 --socks5-hostname "tanginaka:wagditokupal@127.0.0.1:$port" \
              -o /tmp/page.html -w "  zone=$zone http=%{http_code} bytes=%{size_download} time=%{time_total}\n" \
              http://example.com/ 2>&1 | tail -1
            kill $pid 2>/dev/null; wait $pid 2>/dev/null
          done
          exit 0

      - name: Publish
        if: always()
        continue-on-error: true
        run: |
          mkdir -p analysis-bdnet/configs/dns/results
          cp /tmp/bd-tunnel.txt analysis-bdnet/configs/dns/results/bd-tunnel.txt 2>/dev/null || true
          cp /tmp/flags.txt analysis-bdnet/configs/dns/results/bd-flags.txt 2>/dev/null || true
          cp /tmp/bd-tunnel.txt /tmp/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-bdnet/configs/dns/results
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "dns: real traffic through BD's tunnel [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
