name: BD tunnel - real traffic proof

# The narrowest possible harness: run BD NET's own dnstt client under qemu,
# talk SOCKS5 to the port it opens with the credentials the app itself uses
# (tanginaka / wagditokupal, straight out of its LSParanoid string table), and
# ask for a real web page. Everything else is noise; this job answers one
# question: does a byte come back out of BD's tunnel?

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bd-tunnel.yml"

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BD_HOSTS: ${{ vars.BD_HOSTS || '13.140.185.158' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static unzip binutils file dnsutils curl

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee /tmp/apk.txt) 2>&1
          mkdir -p art libs
          run=$(gh run list --workflow=analyze-apk.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
          echo "analysis run: $run"
          art=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                  --jq '.artifacts[] | select(.name=="amtunnel-apk-analysis") | .id' | head -1 || true)
          if [ -n "${art:-}" ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > art/a.zip || true
            unzip -o -q art/a.zip -d art/x || true
          fi
          apk=$(find art -name '*.apk' | head -1 || true)
          echo "APK=$apk"
          [ -z "$apk" ] && exit 1
          unzip -o -j "$apk" 'lib/arm64-v8a/*' -d libs || true
          chmod +x libs/* 2>/dev/null || true
          ls -l libs | head

      - name: Sysroot
        run: |
          exec > >(tee /tmp/sysroot.txt) 2>&1
          set +e
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "system-images;android-24;default;arm64-v8a" 2>&1 | tail -3
          IMGDIR=$(find "$ANDROID_HOME" -type d -path '*android-24*arm64-v8a*' | head -1)
          IMGFILE="$IMGDIR/system.img"
          mkdir -p sysroot/system/bin sysroot/system/lib64
          if sudo mount -o loop,ro "$IMGFILE" /mnt; then
            sudo cp /mnt/bin/linker64 sysroot/system/bin/
            sudo cp -a /mnt/lib64/*.so sysroot/system/lib64/
            sudo umount /mnt
          else
            sudo chmod 644 "$IMGFILE"
            for f in bin/linker64 lib64/libc.so lib64/libdl.so lib64/libm.so lib64/liblog.so; do
              debugfs -R "dump /$f /tmp/x.bin" "$IMGFILE" > /dev/null 2>&1 && \
                sudo mv /tmp/x.bin "sysroot/system/$f"
            done
          fi
          sudo chown -R "$USER" sysroot
          ls sysroot/system/bin sysroot/system/lib64 | head

      - name: "What flags do the two clients actually take?"
        run: |
          exec > >(tee /tmp/flags.txt) 2>&1
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          for lib in libxdnstt libdns; do
            echo "================= $lib -h"
            timeout 20 qemu-aarch64-static "libs/$lib.so" -h 2>&1 | head -45
            echo "================= $lib --help"
            timeout 20 qemu-aarch64-static "libs/$lib.so" --help 2>&1 | head -25
            echo "================= flag-looking strings inside $lib"
            strings -n 3 "libs/$lib.so" | grep -xE "-[a-zA-Z][a-zA-Z0-9-]{1,18}" | sort -u | head -40
          done
          echo "================= does libdns parse the JSON config?"
          strings -n 6 libs/libdns.so | grep -iE "recv_window|confuse|validate|socks5|retry_interval|config.json|config" | head -25

      - name: "Real traffic through BD's tunnel"
        run: |
          exec > >(tee /tmp/bd-tunnel.txt) 2>&1
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          cat > /tmp/enc.py <<'PY'
          import base64, socket, sys
          port = int(sys.argv[1])
          def attempt(u, pw):
              ub, pb = u.encode(), pw.encode()
              if len(ub) > 255 or len(pb) > 255:
                  return b"too-long"
              try:
                  s = socket.create_connection(("127.0.0.1", port), 3); s.settimeout(5)
                  s.sendall(b"\x05\x02\x00\x02")
                  if s.recv(2) != b"\x05\x02":
                      s.close(); return b"no-0x02"
                  s.sendall(bytes([1, len(ub)]) + ub + bytes([len(pb)]) + pb)
                  r = s.recv(2); s.close(); return r
              except Exception as e:
                  return repr(e).encode()[:12]
          u, p = "tanginaka", "wagditokupal"
          variants = [
              ("plain", u, p),
              ("hex user", u.encode().hex(), p),
              ("hex both", u.encode().hex(), p.encode().hex()),
              ("b64 both", base64.b64encode(u.encode()).decode(), base64.b64encode(p.encode()).decode()),
              ("upper", u.upper(), p.upper()),
              ("report+prince", "BD NET VPN", "prince"),
              ("prince+report", "prince", "BD NET VPN"),
              ("zone+pair", "sd-de1.liftmeon.org", "tanginaka"),
              ("user=report", "BD NET VPN", p),
              ("pass=report", u, "BD NET VPN"),
              ("empty user", "", p),
              ("empty pass", u, ""),
          ]
          for name, a, b in variants:
              print(f"    {name:14s} -> {attempt(a, b)!r}", flush=True)
          PY
          for host in 13.140.185.158 13.140.185.159; do
            echo "================= $host"
            timeout 150 qemu-aarch64-static libs/libxdnstt.so \
              -udp "$host:53" -report "BD NET VPN" -pubkey prince \
              "sd-de$( [ "$host" = "13.140.185.158" ] && echo 1 || echo 2 ).liftmeon.org" 127.0.0.1:7500 \
              > /tmp/e.out 2>/tmp/e.err &
            pid=$!
            sleep 11
            python3 /tmp/enc.py 7500
            kill $pid 2>/dev/null; wait $pid 2>/dev/null
          done
          exit 0

      - name: "SlowDNS v2: the client that takes a JSON config and opens SOCKS5 on 7777"
        run: |
          exec > >(tee /tmp/slowdns2.txt) 2>&1
          set +e
          export QEMU_LD_PREFIX="$PWD/sysroot"
          echo "=== how does libdns take its config?"
          strings -n 3 libs/libdns.so | grep -e '^-[a-z]' | sort -u | head -30
          strings -n 6 libs/libdns.so | grep -iE "config|recv_window|confuse|validate|socks5|json" | head -20
          echo "=== the app's own template (from its LSParanoid table)"
          cat <<'JSON'
          {"server":"%s","validate":"%s","confuse":"%s","rx":%s,"tx":%s,"retry":%s,"retry_interval":1,
           "socks5":{"listen":"%s"},"recv_window_conn":%s,"recv_window":%s,"report":"%s"}
          JSON
          for args in "-config /tmp/c.json" "-c /tmp/c.json" "/tmp/c.json"; do
            for vals in "1 196608 3 196608 196608" "3 1 196608 196608 196608" "1 65536 3 65536 65536"; do
              set -- $vals
              cat > /tmp/c.json <<JSON
          {"server":"13.140.185.158:53","validate":"v2","confuse":"","rx":$1,"tx":$2,"retry":$3,"retry_interval":1,"socks5":{"listen":"127.0.0.1:7777"},"recv_window_conn":$4,"recv_window":$5,"report":"BD NET VPN"}
          JSON
              echo "--- libdns $args   (rx=$1 tx=$2 retry=$3 windows=$4/$5)"
              timeout 25 qemu-aarch64-static -strace libs/libdns.so $args > /tmp/ld.out 2>/tmp/ld.err &
              lpid=$!
              sleep 9
              echo "    listeners:"; ss -lntup 2>/dev/null | grep -E ":7777" || echo "      none on 7777"
              echo "    client said:"; head -4 /tmp/ld.out | sed 's/^/      /'
              echo "    syscalls: sendto=$(grep -c sendto /tmp/ld.err) recv=$(grep -cE 'recvfrom\(.*\) = [0-9]+$' /tmp/ld.err)"
              echo "    socks5 probe:"
              python3 - <<'PY'
          import socket
          try:
              s = socket.create_connection(("127.0.0.1", 7777), 3); s.settimeout(4)
              s.sendall(b"\x05\x01\x00"); print("      greeting ->", s.recv(2).hex()); s.close()
          except Exception as e:
              print("      ", repr(e)[:40])
          PY
              kill $lpid 2>/dev/null; wait $lpid 2>/dev/null
            done
          done
          exit 0

      - name: Publish
        if: always()
        continue-on-error: true
        run: |
          mkdir -p analysis-bdnet/configs/dns/results
          cp /tmp/bd-tunnel.txt analysis-bdnet/configs/dns/results/bd-tunnel.txt 2>/dev/null || true
          cp /tmp/flags.txt analysis-bdnet/configs/dns/results/bd-flags.txt 2>/dev/null || true
          cp /tmp/slowdns2.txt analysis-bdnet/configs/dns/results/bd-slowdns2.txt 2>/dev/null || true
          cp /tmp/bd-tunnel.txt /tmp/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-bdnet/configs/dns/results
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "dns: real traffic through BD's tunnel [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
