name: Build dnstt-client for local testing

# The sandbox has no Go toolchain, but it does have UDP/53 to 8.8.8.8 -- which
# forwards to any authoritative server, which is all a DNS tunnel needs. So:
# build a real dnstt-client here, prove it tunnels (local dnstt-server), then
# commit it to tools/bin/ so the same binary can be driven from the sandbox.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dnstt-binary.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build static client + server
        run: |
          set -e
          git clone --depth 1 https://github.com/Mygod/dnstt.git /tmp/dt
          cd /tmp/dt
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/dnstt-client ./dnstt-client
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/dnstt-server ./dnstt-server
          file /tmp/dnstt-client
          ls -l /tmp/dnstt-client /tmp/dnstt-server

      - name: Self-test (real bytes through a local tunnel)
        run: |
          set +e
          OUT=analysis-ultra/report/dnstt-binary-selftest.txt
          : > "$OUT"
          /tmp/dnstt-server -gen-key -privkey-file /tmp/k.key -pubkey-file /tmp/k.pub
          echo "pubkey $(cat /tmp/k.pub)" >> "$OUT"
          mkdir -p /tmp/www && echo hello-through-dnstt > /tmp/www/index.html
          (cd /tmp/www && python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/h.log 2>&1) &
          /tmp/dnstt-server -udp 127.0.0.1:5300 -privkey-file /tmp/k.key t.example 127.0.0.1:8080 > /tmp/s.log 2>&1 &
          sleep 2
          /tmp/dnstt-client -udp 127.0.0.1:5300 -pubkey-file /tmp/k.pub t.example 127.0.0.1:2222 > /tmp/c.log 2>&1 &
          sleep 3
          python3 analysis-ultra/probe_tcp.py "local tunnel" >> "$OUT" 2>&1
          tail -4 /tmp/c.log | sed 's/^/  client: /' >> "$OUT"
          pkill -f dnstt-client; pkill -f dnstt-server; pkill -f "http.server 8080"
          cat "$OUT"

      - name: Try BD NET's server through 8.8.8.8
        run: |
          set +e
          OUT=analysis-ultra/report/bd-via-resolver.txt
          : > "$OUT"
          for key in 2c587152c2f436fc5ec104c928e860879c863f40cd3cf40ed0b41cc2adca5048 \
                     a43ffc4a4831591b9de7c1ed0cb93795c1209295578eacf0b17a0150abe1d3e7; do
            for dom in sd-de1.liftmeon.org sd-de2.liftmeon.org; do
              echo "==== $dom key=${key:0:8}… via 8.8.8.8" >> "$OUT"
              timeout 70 /tmp/dnstt-client -udp 8.8.8.8:53 -pubkey "$key" "$dom" 127.0.0.1:7000 \
                > /tmp/c.log 2>&1 &
              sleep 12
              python3 analysis-ultra/probe_tcp.py "$dom" 7000 >> "$OUT" 2>&1
              pkill -f dnstt-client
              sleep 1
              tail -5 /tmp/c.log | sed 's/^/  client: /' >> "$OUT"
              echo >> "$OUT"
            done
          done
          cat "$OUT"

      - name: Commit the binaries
        if: always()
        run: |
          set +e
          mkdir -p tools/bin
          cp /tmp/dnstt-client tools/bin/dnstt-client-linux-amd64
          cp /tmp/dnstt-server tools/bin/dnstt-server-linux-amd64
          chmod +x tools/bin/dnstt-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-accounts[bot]@users.noreply.github.com"
          git add analysis-ultra tools/bin
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "tools: static dnstt client/server + self-test + BD-via-resolver probe [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" > /dev/null 2>&1
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
